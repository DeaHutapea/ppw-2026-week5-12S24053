$kind: http-request
url: "{{base_url}}/bukus"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "isbn": "123",
        "judul": "A",
        "stok": -5
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
