$kind: http-request
description: NIM yang masih meminjam buku yang sama ditolak dengan HTTP 409 Conflict.
url: "{{base_url}}/peminjamans"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "buku_id": 2,
        "nim_peminjam": "12S24053",
        "nama_peminjam": "Dea Hutapea",
        "durasi_hari": 7
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
